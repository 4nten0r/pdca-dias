services:
  # 1. Dashboard Streamlit (Gantt Executivo & PDCA)
  - type: web
    name: pdca-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    autoDeploy: true

  # 2. Site de Registro de Ações (Node.js)
  - type: web
    name: pdca-site-node
    env: node
    buildCommand: npm install
    startCommand: node site.js
    plan: free
    autoDeploy: true

